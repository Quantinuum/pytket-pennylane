name: Run doc build and create artifact

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "runci/**"

jobs:
  check-docs:
    name: Build docs and create artefact
    uses: Quantinuum/pytket-workflows/.github/workflows/docs-wf.yml@v1
    with:
      extname: "pytket-pennylane"
